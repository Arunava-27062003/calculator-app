<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" value="0" readonly>
        <div class="buttons">
            <button class="btn sci" id="mode-toggle" data-action="toggle-mode">Deg</button>
            <button class="btn sci" data-value="sin(">sin</button>
            <button class="btn sci" data-value="cos(">cos</button>
            <button class="btn sci" data-value="tan(">tan</button>

            <button class="btn sci" data-value="log(">log</button>
            <button class="btn sci" data-value="ln(">ln</button>
            <button class="btn sci" data-value="√(">√</button>
            <button class="btn operator" data-value="^">^</button>

            <button class="btn sci" data-value="(">(</button>
            <button class="btn sci" data-value=")">)</button>
            <button class="btn sci" data-value="π">π</button>
            <button class="btn sci" data-value="e">e</button>

            <button class="btn sci" data-value="!">x!</button>
            <button class="btn operator" data-action="clear">C</button>
            <button class="btn operator" data-action="backspace">⌫</button>
            <button class="btn operator" data-action="percent">%</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="/">÷</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="*">×</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="-">−</button>

            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn equals" data-action="equals">=</button>
            <button class="btn operator" data-value="+">+</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
